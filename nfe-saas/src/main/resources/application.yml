spring:
  application:
    name: nfe-saas

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nfesaas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        id:
          new_generator_mappings: true
        uuid:
          storage: char36

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

crypto:
  aes-master-key: ${AES_MASTER_KEY}
