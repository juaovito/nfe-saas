# Perfil de desenvolvimento local.
# Crie um arquivo .env na raiz do projeto e exporte as variáveis abaixo,
# ou configure-as no seu IDE (Run Configuration > Environment Variables).
#
# Exemplo de .env (nunca comite este arquivo):
#   DB_PASSWORD=suaSenhaLocal
#   JWT_SECRET=dev_jwt_secret_minimo_32_caracteres_aqui
#   AES_MASTER_KEY=dev_aes_master_key_32_caracteres!!

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nfesaas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    br.com.nfesaas: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
